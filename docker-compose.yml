name: starter-dev

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    ports:
      - '127.0.0.1:${DB_PORT:?DB_PORT is required}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    shm_size: 128mb

  redis:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    restart: unless-stopped
    init: true
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # This starter treats Redis as rebuildable data. Enable persistence for durable workloads.
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --appendonly no --save ""
        --maxmemory 256mb --maxmemory-policy noeviction
        --requirepass "$$REDISCLI_AUTH"
    ports:
      - '127.0.0.1:${REDIS_PORT:?REDIS_PORT is required}:6379'
    healthcheck:
      test: [CMD-SHELL, "redis-cli -h 127.0.0.1 ping | grep -q '^PONG$$'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:
