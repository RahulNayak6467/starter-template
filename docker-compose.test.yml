name: starter-test

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    restart: 'no'
    init: true
    environment:
      POSTGRES_USER: ${TEST_DB_USER:?TEST_DB_USER is required}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD is required}
      POSTGRES_DB: ${TEST_DB_NAME:?TEST_DB_NAME is required}
    ports:
      - '127.0.0.1:${TEST_DB_PORT:?TEST_DB_PORT is required}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    shm_size: 128mb

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    restart: 'no'
    init: true
    environment:
      REDISCLI_AUTH: ${TEST_REDIS_PASSWORD:?TEST_REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --appendonly no --save ""
        --maxmemory 128mb --maxmemory-policy noeviction
        --requirepass "$$REDISCLI_AUTH"
    ports:
      - '127.0.0.1:${TEST_REDIS_PORT:?TEST_REDIS_PORT is required}:6379'
    healthcheck:
      test: [CMD-SHELL, "redis-cli -h 127.0.0.1 ping | grep -q '^PONG$$'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
